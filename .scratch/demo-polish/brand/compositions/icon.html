<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=640, height=640" />
    <title>Lazo — prisma icon</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 640px; height: 640px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 640px; height: 640px; overflow: hidden; }
      .clip { position: absolute; inset: 0; width: 100%; height: 100%; }
      svg { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!--
      Variante cuadrada de la marca para favicon/app-icon:
      misma escena que index.html pero reencuadrada — prisma centrado,
      haces cortos que se apagan antes del borde, placa vidrio-oscura
      redondeada para que el haz blanco lea también sobre chrome claro.
      Estática: 1 frame, sin loop (data-duration 0.5).
    -->
    <div
      id="root"
      data-composition-id="icon"
      data-start="0"
      data-width="640"
      data-height="640"
      data-duration="0.5"
    >
      <section id="mark" class="clip" data-start="0" data-duration="0.5" data-track-index="0">
        <svg viewBox="0 0 640 640" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="glassFront" x1="240" y1="140" x2="460" y2="500" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.32" />
              <stop offset="0.4" stop-color="#cdd3ff" stop-opacity="0.14" />
              <stop offset="0.75" stop-color="#8f7bff" stop-opacity="0.08" />
              <stop offset="1" stop-color="#0d0a17" stop-opacity="0.35" />
            </linearGradient>
            <linearGradient id="glassSide" x1="380" y1="130" x2="480" y2="470" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#9945ff" stop-opacity="0.3" />
              <stop offset="0.5" stop-color="#00c2ff" stop-opacity="0.18" />
              <stop offset="1" stop-color="#19fb9b" stop-opacity="0.16" />
            </linearGradient>
            <linearGradient id="edgeGrad" x1="270" y1="140" x2="380" y2="500" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#ffffff" />
              <stop offset="0.55" stop-color="#efeaff" stop-opacity="0.8" />
              <stop offset="1" stop-color="#b9a8ff" stop-opacity="0.5" />
            </linearGradient>
            <linearGradient id="edgeSide" x1="330" y1="130" x2="480" y2="470" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.8" />
              <stop offset="0.55" stop-color="#00c2ff" stop-opacity="0.45" />
              <stop offset="1" stop-color="#19fb9b" stop-opacity="0.35" />
            </linearGradient>
            <linearGradient id="beamIn" x1="40" y1="340" x2="263" y2="340" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#f4f1ff" stop-opacity="0" />
              <stop offset="0.25" stop-color="#f4f1ff" stop-opacity="0.75" />
              <stop offset="1" stop-color="#ffffff" />
            </linearGradient>
            <linearGradient id="innerSpectrum" x1="0" y1="300" x2="0" y2="400" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#9945ff" stop-opacity="0.55" />
              <stop offset="0.5" stop-color="#00c2ff" stop-opacity="0.5" />
              <stop offset="1" stop-color="#19fb9b" stop-opacity="0.55" />
            </linearGradient>
            <linearGradient id="fanFill" x1="0" y1="232" x2="0" y2="444" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#9945ff" stop-opacity="0.36" />
              <stop offset="0.5" stop-color="#00c2ff" stop-opacity="0.28" />
              <stop offset="1" stop-color="#19fb9b" stop-opacity="0.36" />
            </linearGradient>
            <linearGradient id="beamViolet" x1="385" y1="0" x2="592" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#c39aff" />
              <stop offset="0.4" stop-color="#9945ff" />
              <stop offset="1" stop-color="#9945ff" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="beamCyan" x1="385" y1="0" x2="592" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#9be8ff" />
              <stop offset="0.4" stop-color="#00c2ff" />
              <stop offset="1" stop-color="#00c2ff" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="beamGreen" x1="385" y1="0" x2="592" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#a9ffd9" />
              <stop offset="0.4" stop-color="#19fb9b" />
              <stop offset="1" stop-color="#19fb9b" stop-opacity="0" />
            </linearGradient>
            <radialGradient id="caustic" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.85" />
              <stop offset="0.4" stop-color="#d8ccff" stop-opacity="0.32" />
              <stop offset="1" stop-color="#9945ff" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="entryGlow" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.9" />
              <stop offset="0.5" stop-color="#f4f1ff" stop-opacity="0.3" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="plateTop" cx="0.5" cy="0.15" r="0.9">
              <stop offset="0" stop-color="#9945ff" stop-opacity="0.22" />
              <stop offset="0.55" stop-color="#141026" stop-opacity="0.1" />
              <stop offset="1" stop-color="#0b0912" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="plateEdge" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
              <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.05" />
              <stop offset="1" stop-color="#9945ff" stop-opacity="0.12" />
            </linearGradient>
            <filter id="blur6" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="6" />
            </filter>
            <filter id="blur10" x="-80%" y="-80%" width="260%" height="260%">
              <feGaussianBlur stdDeviation="10" />
            </filter>
            <clipPath id="fanClip"><polygon points="385,362 592,232 592,448" /></clipPath>
            <clipPath id="prismClip"><polygon points="330,150 210,490 440,490" /></clipPath>
          </defs>

          <!-- placa vidrio-oscura (legible sobre chrome claro y oscuro) -->
          <rect x="0" y="0" width="640" height="640" rx="148" fill="#0b0912" />
          <rect x="0" y="0" width="640" height="640" rx="148" fill="url(#plateTop)" />
          <rect x="1.5" y="1.5" width="637" height="637" rx="146" fill="none" stroke="url(#plateEdge)" stroke-width="3" />

          <!-- haz blanco entrante -->
          <g>
            <line x1="44" y1="340" x2="261" y2="340" stroke="url(#beamIn)" stroke-width="16" stroke-linecap="round" filter="url(#blur10)" opacity="0.55" />
            <line x1="44" y1="340" x2="261" y2="340" stroke="url(#beamIn)" stroke-width="4.4" stroke-linecap="round" />
          </g>
          <circle cx="263" cy="340" r="30" fill="url(#entryGlow)" opacity="0.75" />

          <!-- prisma -->
          <g>
            <!-- tapa trasera: front + (42,-26) -->
            <polygon points="372,124 252,464 482,464" fill="#ffffff" fill-opacity="0.05" stroke="#dcd4ff" stroke-opacity="0.42" stroke-width="2" stroke-linejoin="round" />
            <!-- cara derecha A-C-C'-A' -->
            <polygon points="330,150 440,490 482,464 372,124" fill="url(#glassSide)" stroke="url(#edgeSide)" stroke-width="2.2" stroke-linejoin="round" />
            <!-- tapa frontal -->
            <polygon points="330,150 210,490 440,490" fill="url(#glassFront)" stroke="url(#edgeGrad)" stroke-width="3.4" stroke-linejoin="round" />
            <!-- bisel interior -->
            <polygon points="330,164 218,481 433,481" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.6" stroke-linejoin="round" />
            <!-- dispersión interna -->
            <g clip-path="url(#prismClip)">
              <polygon points="263,336 392,352 392,374 263,344" fill="url(#innerSpectrum)" opacity="0.55" />
              <circle cx="385" cy="362" r="48" fill="url(#caustic)" opacity="0.8" />
            </g>
            <!-- ridges -->
            <line x1="330" y1="150" x2="372" y2="124" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.8" stroke-linecap="round" />
            <line x1="210" y1="490" x2="252" y2="464" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.4" stroke-linecap="round" />
            <line x1="440" y1="490" x2="482" y2="464" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.6" stroke-linecap="round" />
            <!-- especular -->
            <line x1="317" y1="172" x2="286" y2="272" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round" />
            <line x1="323" y1="160" x2="299" y2="238" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round" filter="url(#blur6)" />
          </g>

          <!-- dispersión corta (se apaga antes del borde) -->
          <g>
            <polygon points="388,358 592,236 592,444 388,368" fill="url(#fanFill)" filter="url(#blur6)" opacity="0.85" />
            <line x1="385" y1="362" x2="590" y2="250" stroke="url(#beamViolet)" stroke-width="11" stroke-linecap="round" filter="url(#blur6)" opacity="0.75" />
            <line x1="385" y1="362" x2="590" y2="338" stroke="url(#beamCyan)" stroke-width="10" stroke-linecap="round" filter="url(#blur6)" opacity="0.7" />
            <line x1="385" y1="362" x2="590" y2="428" stroke="url(#beamGreen)" stroke-width="11" stroke-linecap="round" filter="url(#blur6)" opacity="0.75" />
            <line x1="385" y1="362" x2="590" y2="250" stroke="url(#beamViolet)" stroke-width="3.2" stroke-linecap="round" />
            <line x1="385" y1="362" x2="590" y2="338" stroke="url(#beamCyan)" stroke-width="3.2" stroke-linecap="round" />
            <line x1="385" y1="362" x2="590" y2="428" stroke="url(#beamGreen)" stroke-width="3.2" stroke-linecap="round" />
          </g>
        </svg>
      </section>
    </div>
    <script>
      // Icono estático: timeline vacío registrado para satisfacer el runtime.
      window.__timelines["icon"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
