<text x="24.0" y="422.0" font-size="11" fill="#6b6880" text-anchor="start" font-weight="normal">Kamino, Jupiter y Huma: referencias de oct-2026 citadas en plan-de-negocio.md §6.4. Lazo: escenario del modelo,</text>
