<text x="706.2" y="177.3" font-size="12" fill="#1d1b2e" text-anchor="middle" font-weight="700">74%</text>
<text x="24.0" y="422.0" font-size="11" fill="#6b6880" text-anchor="start" font-weight="normal">Mes 0 = el 20% que siempre queda en caja. Después entran las cuotas: los planes son cortos, la plata vuelve rápido.</text>
<text x="24.0" y="438.0" font-size="11" fill="#6b6880" text-anchor="start" font-weight="normal">Por eso alcanza con aviso de 30 días y un tope de retiros por mes (plan-de-negocio.md §9.1). No es un pronóstico.</text>
