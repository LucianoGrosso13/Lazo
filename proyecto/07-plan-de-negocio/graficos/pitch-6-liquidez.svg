<text x="24.0" y="34.0" font-size="19" fill="#1d1b2e" text-anchor="start" font-weight="700">Si los inversores quieren retirar: en 2 meses vuelve el 85% a caja</text>
<text x="24.0" y="56.0" font-size="13" fill="#6b6880" text-anchor="start" font-weight="normal">% del pool disponible en efectivo si Lazo deja de prestar hoy (planes de 3 cuotas)</text>
<line x1="78" x2="796" y1="368.0" y2="368.0" stroke="#1d1b2e" stroke-width="1.2"/>
