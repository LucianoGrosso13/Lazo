<text x="70.0" y="121.1" font-size="11" fill="#6b6880" text-anchor="end" font-weight="normal">100%</text>
<text x="167.8" y="386.0" font-size="11" fill="#6b6880" text-anchor="middle" font-weight="normal">Hoy</text>
