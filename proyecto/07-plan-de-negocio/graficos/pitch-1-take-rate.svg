<text x="24.0" y="214.0" font-size="13" fill="#1d1b2e" text-anchor="start" font-weight="600">Lazo</text>
<text x="24.0" y="230.0" font-size="11" fill="#6b6880" text-anchor="start" font-weight="normal">ingresos de la empresa, escenario</text>
