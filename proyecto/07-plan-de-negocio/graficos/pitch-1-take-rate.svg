<text x="24.0" y="422.0" font-size="11" fill="#6b6880" text-anchor="start" font-weight="normal">Klarna: ingresos / volumen 2024 (US$2.810M / US$105.000M, vía Sacra). Affirm: ingresos menos costos de transacción / volumen,</text>
<text x="24.0" y="438.0" font-size="11" fill="#6b6880" text-anchor="start" font-weight="normal">FY2025 (carta a accionistas, SEC). Lazo: originación + administración + rampa de una PC de US$1.000; la mora la absorbe el pool.</text>
