<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="820" height="460" fill="#ffffff" rx="12"/>
<text x="24.0" y="34.0" font-size="19" fill="#1d1b2e" text-anchor="start" font-weight="700">Si el fiador paga siempre, el comercio puede pagar menos</text>
<text x="24.0" y="56.0" font-size="13" fill="#6b6880" text-anchor="start" font-weight="normal">Rendimiento anual del pool según la comisión del comercio (% del precio) y cuánto se le cobra al fiador</text>
<line x1="78" x2="796" y1="368.0" y2="368.0" stroke="#e6e4ef" stroke-width="1"/>
<text x="70.0" y="372.0" font-size="11" fill="#6b6880" text-anchor="end" font-weight="normal">-10%</text>
<line x1="78" x2="796" y1="316.0" y2="316.0" stroke="#1d1b2e" stroke-width="1.2"/>
<text x="70.0" y="320.0" font-size="11" fill="#6b6880" text-anchor="end" font-weight="normal">0%</text>
<line x1="78" x2="796" y1="264.0" y2="264.0" stroke="#e6e4ef" stroke-width="1"/>
<text x="70.0" y="268.0" font-size="11" fill="#6b6880" text-anchor="end" font-weight="normal">10%</text>
<line x1="78" x2="796" y1="212.0" y2="212.0" stroke="#e6e4ef" stroke-width="1"/>
<text x="70.0" y="216.0" font-size="11" fill="#6b6880" text-anchor="end" font-weight="normal">20%</text>
<line x1="78" x2="796" y1="160.0" y2="160.0" stroke="#e6e4ef" stroke-width="1"/>
<text x="70.0" y="164.0" font-size="11" fill="#6b6880" text-anchor="end" font-weight="normal">30%</text>
<line x1="78" x2="796" y1="108.0" y2="108.0" stroke="#e6e4ef" stroke-width="1"/>
<text x="70.0" y="112.0" font-size="11" fill="#6b6880" text-anchor="end" font-weight="normal">40%</text>
<text x="78.0" y="386.0" font-size="11" fill="#6b6880" text-anchor="middle" font-weight="normal">5%</text>
<text x="257.5" y="386.0" font-size="11" fill="#6b6880" text-anchor="middle" font-weight="normal">6%</text>
<text x="437.0" y="386.0" font-size="11" fill="#6b6880" text-anchor="middle" font-weight="normal">7%</text>
<text x="616.5" y="386.0" font-size="11" fill="#6b6880" text-anchor="middle" font-weight="normal">8%</text>
<text x="796.0" y="386.0" font-size="11" fill="#6b6880" text-anchor="middle" font-weight="normal">9%</text>
<text x="437.0" y="406.0" font-size="12" fill="#6b6880" text-anchor="middle" font-weight="normal">Comisión del comercio (% del precio)</text>
<text x="22" y="238.0" font-size="12" fill="#6b6880" text-anchor="middle" transform="rotate(-90 22 238.0)">Rendimiento anual del pool</text>
<line x1="78" x2="796" y1="274.4" y2="274.4" stroke="#0284c7" stroke-dasharray="3 4" stroke-width="1.2"/>
<text x="86.0" y="269.4" font-size="11" fill="#0284c7" text-anchor="start" font-weight="600">Senior: 8%</text>
<polyline points="78.0,331.7 257.5,306.7 437.0,281.8 616.5,256.8 796.0,231.8" fill="none" stroke="#dc2626" stroke-width="2.6" stroke-linejoin="round" />
<polyline points="78.0,319.7 257.5,294.7 437.0,269.8 616.5,244.8 796.0,219.8" fill="none" stroke="#ea7a0c" stroke-width="2.6" stroke-linejoin="round" />
<polyline points="78.0,311.3 257.5,286.3 437.0,261.3 616.5,236.4 796.0,211.4" fill="none" stroke="#0f9d6b" stroke-width="2.6" stroke-linejoin="round" />
<line x1="24.0" x2="46.0" y1="84" y2="84" stroke="#dc2626" stroke-width="3" />
<text x="52.0" y="88.0" font-size="12" fill="#1d1b2e" text-anchor="start" font-weight="normal">Recupero 80% (base)</text>
<line x1="281.3333333333333" x2="303.3333333333333" y1="84" y2="84" stroke="#ea7a0c" stroke-width="3" />
<text x="309.3" y="88.0" font-size="12" fill="#1d1b2e" text-anchor="start" font-weight="normal">Recupero 90%</text>
<line x1="538.6666666666666" x2="560.6666666666666" y1="84" y2="84" stroke="#0f9d6b" stroke-width="3" />
<text x="566.7" y="88.0" font-size="12" fill="#1d1b2e" text-anchor="start" font-weight="normal">Recupero 95% (tarjeta ejecutada)</text>
<text x="24.0" y="422.0" font-size="11" fill="#6b6880" text-anchor="start" font-weight="normal">Modo sin interés, 3 cuotas, mora 30%. Recupero 95% = tarjeta del fiador ejecutada directo y que no se puede sacar con planes activos.</text>
<text x="24.0" y="438.0" font-size="11" fill="#6b6880" text-anchor="start" font-weight="normal">Debajo de la línea del 8%, el junior gana menos que el senior; más abajo (~6%), pierde. Es un escenario, no un pronóstico.</text>
</svg>