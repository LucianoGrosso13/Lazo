<rect x="456.0" y="86" width="14" height="14" rx="3" fill="#9ca3af"/>
<text x="476.0" y="98.0" font-size="12" fill="#1d1b2e" text-anchor="start" font-weight="normal">C. Un solo tramo</text>
<text x="24.0" y="422.0" font-size="11" fill="#6b6880" text-anchor="start" font-weight="normal">B = el senior cobra un piso de 8% y además 20% de lo que el pool gane por encima de ese 8%. El junior cobra el resto.</text>
<text x="24.0" y="438.0" font-size="11" fill="#6b6880" text-anchor="start" font-weight="normal">En un año malo, A y B son iguales: el junior pierde primero y el senior cobra su 8%. En C pierden todos por igual. No es un pronóstico.</text>
