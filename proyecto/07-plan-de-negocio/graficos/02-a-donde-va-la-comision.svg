<text x="24.0" y="422.0" font-size="11" fill="#6b6880" text-anchor="start" font-weight="normal">Valores esperados por plan. La pérdida es la mora neta del recupero del fiador más aranceles.</text>
<text x="24.0" y="438.0" font-size="11" fill="#6b6880" text-anchor="start" font-weight="normal">Escenario del modelo (modelo-v3.py): supuestos base (mora 8%, recupero fiador 80%). No es un pronóstico. Todo corre en devnet.</text>
