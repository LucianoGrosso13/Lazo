<text x="347.2" y="400.0" font-size="11" fill="#6b6880" text-anchor="middle" font-weight="normal">mora 30%</text>
<rect x="290.8" y="233.9" width="55.4" height="9.1" rx="3" fill="#0284c7"/>
<text x="318.5" y="227.9" font-size="12" fill="#1d1b2e" text-anchor="middle" font-weight="700">8%</text>
<rect x="348.2" y="243.0" width="55.4" height="93.2" rx="3" fill="#0f9d6b"/>
<text x="376.0" y="350.2" font-size="12" fill="#1d1b2e" text-anchor="middle" font-weight="700">-82%</text>
<text x="526.8" y="386.0" font-size="11" fill="#6b6880" text-anchor="middle" font-weight="normal">Año malo</text>
<text x="526.8" y="400.0" font-size="11" fill="#6b6880" text-anchor="middle" font-weight="normal">mora 40%, recupero 65%</text>
<rect x="470.3" y="243.0" width="55.4" height="16.8" rx="3" fill="#0284c7"/>
<text x="498.0" y="273.8" font-size="12" fill="#1d1b2e" text-anchor="middle" font-weight="700">-15%</text>
<rect x="527.8" y="243.0" width="55.4" height="113.6" rx="3" fill="#0f9d6b"/>
<text x="555.5" y="370.6" font-size="12" fill="#1d1b2e" text-anchor="middle" font-weight="700">-100%</text>
<text x="706.2" y="386.0" font-size="11" fill="#6b6880" text-anchor="middle" font-weight="normal">Año muy malo</text>
<text x="706.2" y="400.0" font-size="11" fill="#6b6880" text-anchor="middle" font-weight="normal">mora 50%, recupero 50%</text>
<rect x="649.8" y="243.0" width="55.4" height="57.9" rx="3" fill="#0284c7"/>
<text x="677.5" y="314.9" font-size="12" fill="#1d1b2e" text-anchor="middle" font-weight="700">-51%</text>
