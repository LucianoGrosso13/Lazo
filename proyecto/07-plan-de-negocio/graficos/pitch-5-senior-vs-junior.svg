<text x="735.0" y="370.6" font-size="12" fill="#1d1b2e" text-anchor="middle" font-weight="700">-100%</text>
<rect x="24" y="86" width="14" height="14" rx="3" fill="#0284c7"/>
<text x="44.0" y="98.0" font-size="12" fill="#1d1b2e" text-anchor="start" font-weight="normal">Senior (tramo protegido)</text>
<rect x="216.39999999999998" y="86" width="14" height="14" rx="3" fill="#0f9d6b"/>
<text x="236.4" y="98.0" font-size="12" fill="#1d1b2e" text-anchor="start" font-weight="normal">Junior (tramo de primera pérdida)</text>
<text x="24.0" y="422.0" font-size="11" fill="#6b6880" text-anchor="start" font-weight="normal">Senior = 80% del pool, 8% fijo, cobra primero (como un préstamo). Junior = 20%, se queda con lo que sobra (como un socio).</text>
<text x="24.0" y="438.0" font-size="11" fill="#6b6880" text-anchor="start" font-weight="normal">Si el junior ganara menos que el senior, nadie lo pondría, y sin junior no hay protección para el senior. No es un pronóstico.</text>
</svg>