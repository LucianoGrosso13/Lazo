<text x="70.0" y="133.4" font-size="11" fill="#6b6880" text-anchor="end" font-weight="normal">100%</text>
<text x="167.8" y="386.0" font-size="11" fill="#6b6880" text-anchor="middle" font-weight="normal">Año bueno</text>
<text x="167.8" y="400.0" font-size="11" fill="#6b6880" text-anchor="middle" font-weight="normal">mora 20%</text>
<rect x="111.3" y="233.9" width="55.4" height="9.1" rx="3" fill="#0284c7"/>
<text x="139.0" y="227.9" font-size="12" fill="#1d1b2e" text-anchor="middle" font-weight="700">8%</text>
<rect x="168.8" y="243.0" width="55.4" height="51.6" rx="3" fill="#0f9d6b"/>
<text x="196.5" y="308.6" font-size="12" fill="#1d1b2e" text-anchor="middle" font-weight="700">-45%</text>
