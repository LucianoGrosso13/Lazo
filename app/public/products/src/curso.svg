<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9945FF"/>
      <stop offset="0.52" stop-color="#00C2FF"/>
      <stop offset="1" stop-color="#19FB9B"/>
    </linearGradient>
    <linearGradient id="specPlay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9945FF"/>
      <stop offset="0.5" stop-color="#00C2FF"/>
      <stop offset="1" stop-color="#19FB9B"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.44" r="0.62">
      <stop offset="0" stop-color="#19FB9B" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#00C2FF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#00C2FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#19FB9B" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#19FB9B" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur18" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="blur10" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="#0b0817"/>
  <rect width="1200" height="900" fill="url(#halo)"/>
  <ellipse cx="600" cy="742" rx="420" ry="82" fill="url(#floor)"/>

  <!-- luz ambiental detrás de la ventana -->
  <rect x="322" y="182" width="556" height="470" rx="26" fill="none" stroke="url(#spec)" stroke-width="10" filter="url(#blur18)" opacity="0.55"/>

  <!-- ventana de la lección -->
  <rect x="322" y="182" width="556" height="470" rx="26" fill="#0e0b1a" fill-opacity="0.92" stroke="url(#spec)" stroke-width="5"/>
  <line x1="322" y1="256" x2="878" y2="256" stroke="#f4f1ff" stroke-opacity="0.16" stroke-width="3"/>
  <circle cx="362" cy="219" r="9" fill="#9945FF" fill-opacity="0.85"/>
  <circle cx="398" cy="219" r="9" fill="#00C2FF" fill-opacity="0.85"/>
  <circle cx="434" cy="219" r="9" fill="#19FB9B" fill-opacity="0.85"/>
  <rect x="470" y="206" width="330" height="26" rx="13" fill="none" stroke="#f4f1ff" stroke-opacity="0.18" stroke-width="2.5"/>

  <!-- play: triángulo espectral -->
  <path d="M540 330 L540 500 L688 415 Z" fill="url(#specPlay)" filter="url(#blur10)" opacity="0.8"/>
  <path d="M540 330 L540 500 L688 415 Z" fill="url(#specPlay)"/>
  <path d="M540 330 L540 500 L688 415 Z" fill="none" stroke="#f4f1ff" stroke-opacity="0.5" stroke-width="3" stroke-linejoin="round"/>

  <!-- barra de progreso -->
  <rect x="372" y="556" width="456" height="14" rx="7" fill="#f4f1ff" fill-opacity="0.12"/>
  <rect x="372" y="556" width="212" height="14" rx="7" fill="url(#spec)"/>
  <circle cx="584" cy="563" r="15" fill="#f4f1ff"/>

  <!-- líneas de texto -->
  <g stroke-linecap="round" stroke-width="12">
    <line x1="372" y1="612" x2="560" y2="612" stroke="#f4f1ff" stroke-opacity="0.34"/>
    <line x1="372" y1="642" x2="488" y2="642" stroke="#f4f1ff" stroke-opacity="0.2"/>
  </g>
  <rect x="702" y="600" width="126" height="52" rx="26" fill="none" stroke="url(#spec)" stroke-width="4"/>
</svg>
