      <script>

      // Split every .type element into per-character spans (typewriter reveal).
      document.querySelectorAll(".type").forEach((el) => {
        const walk = (node) => {
          [...node.childNodes].forEach((c) => {
            if (c.nodeType === 3) {
              const frag = document.createDocumentFragment();
              [...c.textContent].forEach((ch) => {
                const s = document.createElement("span");
                s.className = "ch";
                s.textContent = ch;
                frag.appendChild(s);
              });
              c.replaceWith(frag);
            } else if (c.nodeType === 1) walk(c);
          });
        };
        walk(el);
      });
      // Prepare stroke-draw paths.
      document.querySelectorAll("path.draw").forEach((p) => {
        const len = Math.ceil(p.getTotalLength());
        p.style.strokeDasharray = len;
        p.dataset.len = len;
      });

      
      const S = 9.8; // slot start in the main timeline; tweens below are written in main-timeline seconds
      const tl = gsap.timeline({ paused: true });
      const chars = (sel) => document.querySelectorAll(sel + " .ch");
      const typeIn = (sel, at, per = 0.045) =>
        tl.fromTo(chars(sel), { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: per, ease: "none" }, at - S);
      const draw = (sel, at, dur = 0.45, ease = "power2.inOut") =>
        document.querySelectorAll(sel).forEach((p) =>
          tl.fromTo(p, { strokeDashoffset: p.dataset.len }, { strokeDashoffset: 0, duration: dur, ease }, at - S)
        );
      const fadeOut = (sel, at, dur = 0.3) => tl.to(sel, { opacity: 0, y: -12, duration: dur, ease: "power2.in" }, at - S);
      const count = (el, from, to, at, dur, fmt) => {
        const s = { v: from };
        tl.fromTo(s, { v: from }, { v: to, duration: dur, ease: "power3.out", onUpdate: () => (el.textContent = fmt(s.v)) }, at - S);
      };
      const wipeIn = (sel, at) => tl.fromTo(sel, { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power3.inOut" }, at - S);
      const wipeOut = (sel, at) => tl.fromTo(sel, { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(0% 100% 0% 0%)", duration: 0.45, ease: "power3.inOut", immediateRender: false }, at - S);

// ---------- 02 argentina ----------
      tl.fromTo("#ov-stat .scrim-tl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.8 - S);
      tl.fromTo("#stat-n", { opacity: 0, scale: 0.7, transformOrigin: "0% 100%" }, { opacity: 1, scale: 1, duration: 1.3, ease: "power3.out" }, 9.85 - S);
      count(document.getElementById("stat-v"), 0, 45, 9.85, 1.3, (v) => Math.round(v));
      tl.fromTo("#stat-label", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 10.4 - S);
      tl.fromTo("#stat-chip", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "back.out(1.6)" }, 10.9 - S);

      wipeIn("#p1-wrap", 13.9);
      tl.set("#ov-stat", { opacity: 0 }, 14.4 - S);
      tl.fromTo("#p1-n", { x: -60, opacity: 0.4 }, { x: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 14.0 - S);
      tl.fromTo("#p1-src", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 14.4 - S);
      tl.fromTo("#p1-c1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 14.85 - S);
      draw("#p1-a1 path", 15.7, 0.4);
      tl.fromTo("#p1-c2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 16.2 - S);
      draw("#p1-a2 path", 16.95, 0.35);
      tl.fromTo("#p1-c3", { opacity: 0, y: 20, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 17.3 - S);
      wipeOut("#p1-wrap", 20.7);

      tl.fromTo("#noway", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "back.out(1.6)" }, 24.15 - S);
      fadeOut("#noway", 26.75);

      
        window.__timelines["s02-argentina"] = tl;
      </script>
