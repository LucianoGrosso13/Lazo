      <script>

      // Split every .type element into per-character spans (typewriter reveal).
      document.querySelectorAll(".type").forEach((el) => {
        const walk = (node) => {
          [...node.childNodes].forEach((c) => {
            if (c.nodeType === 3) {
              const frag = document.createDocumentFragment();
              [...c.textContent].forEach((ch) => {
                const s = document.createElement("span");
                s.className = "ch";
                s.textContent = ch;
                frag.appendChild(s);
              });
              c.replaceWith(frag);
            } else if (c.nodeType === 1) walk(c);
          });
        };
        walk(el);
      });
      // Prepare stroke-draw paths.
      document.querySelectorAll("path.draw").forEach((p) => {
        const len = Math.ceil(p.getTotalLength());
        p.style.strokeDasharray = len;
        p.dataset.len = len;
      });

      
      const S = 27.7; // slot start in the main timeline; tweens below are written in main-timeline seconds
      const tl = gsap.timeline({ paused: true });
      const chars = (sel) => document.querySelectorAll(sel + " .ch");
      const typeIn = (sel, at, per = 0.045) =>
        tl.fromTo(chars(sel), { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: per, ease: "none" }, at - S);
      const draw = (sel, at, dur = 0.45, ease = "power2.inOut") =>
        document.querySelectorAll(sel).forEach((p) =>
          tl.fromTo(p, { strokeDashoffset: p.dataset.len }, { strokeDashoffset: 0, duration: dur, ease }, at - S)
        );
      const fadeOut = (sel, at, dur = 0.3) => tl.to(sel, { opacity: 0, y: -12, duration: dur, ease: "power2.in" }, at - S);
      const count = (el, from, to, at, dur, fmt) => {
        const s = { v: from };
        tl.fromTo(s, { v: from }, { v: to, duration: dur, ease: "power3.out", onUpdate: () => (el.textContent = fmt(s.v)) }, at - S);
      };
      const wipeIn = (sel, at) => tl.fromTo(sel, { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power3.inOut" }, at - S);
      const wipeOut = (sel, at) => tl.fromTo(sel, { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(0% 100% 0% 0%)", duration: 0.45, ease: "power3.inOut", immediateRender: false }, at - S);

// ---------- 03 who we are · lazo · credit layer ----------
      tl.fromTo("#lt-scrim", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 27.7 - S);
      [["#lt-luciano", 27.8], ["#lt-ignacio", 28.5]].forEach(([id, at]) => {
        tl.fromTo(id + " .ln", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, at - S);
        tl.fromTo(id + " .k", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, at + 0.1 - S);
        tl.fromTo(id + " .nm", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, at + 0.05 - S);
      });
      fadeOut("#ov-names .lt, #lt-scrim", 29.75, 0.3);

      tl.fromTo("#lazo-scrim", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 29.9 - S);
      tl.fromTo("#lazo-logo", { opacity: 0, scale: 0.8, rotation: -6 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.7)" }, 29.95 - S);
      typeIn("#lazo-word", 30.12, 0.07);
      tl.to("#lazo-mark", { scale: 1.04, duration: 1.6, ease: "none" }, 30.4 - S);
      tl.fromTo("#lazo-url", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 30.45 - S);
      tl.to("#lazo-mark, #lazo-scrim, #lazo-url", { opacity: 0, duration: 0.3, ease: "power2.in" }, 31.95 - S);

      tl.fromTo("#ly-scrim", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 32.0 - S);
      tl.fromTo("#ly-people", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 32.1 - S);
      draw("#ly-a1 path", 32.45, 0.35);
      tl.fromTo("#ly-lazo", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, 32.7 - S);
      draw("#ly-a2 path", 33.2, 0.35);
      tl.fromTo("#ly-wallets", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 33.55 - S);
      tl.fromTo("#ly-chip", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 34.2 - S);
      fadeOut("#ov-layer .node, #ov-layer .arrow, #ly-chip, #ly-scrim", 36.7, 0.3);
