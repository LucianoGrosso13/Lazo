  <body>
    <template>
      <style>
        @font-face {
                font-family: "Bricolage Grotesque";
                src: url("assets/fonts/bricolage-latin.woff2") format("woff2");
                font-weight: 200 800;
                font-stretch: 75% 100%;
              }
        @font-face {
                font-family: "Martian Mono";
                src: url("assets/fonts/martian-mono-latin.woff2") format("woff2");
                font-weight: 100 800;
              }
        #root {
                --abyss: #07060b;
                --abyss-2: #0d0a17;
                --abyss-3: #141026;
                --ink: #f4f1ff;
                --ink-2: #b9b3d6;
                --ink-3: #9a93bb;
                --ghost: #6a6488;
                --violet: #9945ff;
                --cyan: #00c2ff;
                --green: #19fb9b;
                --crack: #ff5470;
                --hair: rgb(244 241 255 / 0.16);
                --display: "Bricolage Grotesque", sans-serif;
                --mono: "Martian Mono", monospace;
              }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: var(--ink);
          font-family: var(--display);
        }
        #root * {
          box-sizing: border-box;
        }
        .abs {
                position: absolute;
              }
        .panel {
                position: absolute;
                inset: 0;
                background: radial-gradient(70% 85% at 32% 40%, #161130 0%, #0b0915 55%, #07060b 100%);
              }
        .node {
                position: absolute;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 14px;
                font-weight: 700;
                font-size: 30px;
                color: var(--ink);
                background: rgb(13 10 23 / 0.92);
                border: 2px solid var(--hair);
                border-radius: 22px;
              }
        /* ---------- 07b ledger: the pool, its rules and the on-chain record (full screen) ---------- */
        #lg-kicker {
                left: 0;
                right: 0;
                top: 70px;
                text-align: center;
                font-family: var(--mono);
                font-size: 22px;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: var(--ink-3);
              }
        #pool {
                left: 810px;
                top: 150px;
                width: 300px;
                height: 300px;
                border-radius: 50%;
                border: 4px solid var(--cyan);
                overflow: hidden;
                background: rgb(20 16 38 / 0.9);
              }
        #pool-level {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                height: 100%;
                background: linear-gradient(to top, rgb(153 69 255 / 0.85), rgb(0 194 255 / 0.55));
                transform-origin: 50% 100%;
              }
        #pool-text {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 6px;
              }
        #pool-text .k {
                font-family: var(--mono);
                font-size: 20px;
                letter-spacing: 0.12em;
              }
        #pool-text .t {
                font-size: 52px;
                font-weight: 800;
                letter-spacing: -0.02em;
              }
        .arrow {
                position: absolute;
                overflow: visible;
              }
        .coin {
                position: absolute;
                left: 0;
                top: 0;
                width: 34px;
                height: 34px;
                margin: -17px 0 0 -17px;
                border-radius: 50%;
                opacity: 0;
              }
        .coin.out {
                background: var(--green);
              }
        .coin.in {
                background: var(--cyan);
              }
        .col {
                position: absolute;
                top: 560px;
                width: 760px;
                background: rgb(13 10 23 / 0.92);
                border: 2px solid var(--hair);
                border-radius: 28px;
                padding: 28px 34px;
              }
        .col h4 {
                font-family: var(--mono);
                font-weight: 500;
                font-size: 20px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--ink-3);
                margin-bottom: 10px;
              }
        .rule {
                display: flex;
                align-items: center;
                gap: 18px;
                font-size: 36px;
                font-weight: 700;
                padding: 16px 0;
                border-top: 2px solid var(--hair);
                opacity: 0.3;
              }
        .rule.first {
                border-top: 0;
              }
        .rule svg {
                flex: none;
              }
        .lrow {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                font-size: 32px;
                padding: 12px 0;
                border-top: 2px solid var(--hair);
              }
        .lrow.first {
                border-top: 0;
              }
        .lrow .num {
                font-family: var(--mono);
                font-size: 28px;
                font-variant-numeric: tabular-nums;
              }
      </style>
      <div id="root" data-composition-id="s07b-ledger" data-width="1920" data-height="1080">
        <div id="ov-ledger" class="grp">
        <div id="lg-wrap" class="abs" style="inset: 0">
          <div class="panel"></div>
          <div id="lg-kicker" class="abs">Lazo program on Solana · rules anyone can check</div>
          <div id="pool" class="abs">
            <div id="pool-level"></div>
            <div id="pool-text"><span class="k">SHARED</span><span class="t">Credit pool</span></div>
          </div>
          <div id="po-buyer" class="node" style="left: 330px; top: 250px; width: 300px; height: 100px">Buyers</div>
          <div id="po-merchant" class="node" style="left: 1290px; top: 250px; width: 300px; height: 100px">Merchants</div>
          <svg class="arrow" style="left: 0; top: 0" width="1920" height="1080" viewBox="0 0 1920 1080">
            <path id="po-out" d="M1112 270 C 1170 200, 1230 205, 1288 262" stroke="#19fb9b" stroke-width="5" fill="none" stroke-linecap="round" />
            <path id="po-out-h" d="M1262 254l28 10-10 28" stroke="#19fb9b" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
            <path id="po-in" d="M632 330 C 690 410, 750 410, 808 345" stroke="#00c2ff" stroke-width="5" fill="none" stroke-linecap="round" />
            <path id="po-in-h" d="M780 342l29 0 0 29" stroke="#00c2ff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <div class="coin out" id="coin-o1"></div>
          <div class="coin out" id="coin-o2"></div>
          <div class="coin in" id="coin-i1"></div>
          <div class="coin in" id="coin-i2"></div>
          <div class="coin in" id="coin-i3"></div>
          <div class="col" style="left: 160px">
            <h4>Rules</h4>
            <div id="rl-1" class="rule first"><svg width="40" height="40" viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="rgb(25 251 155 / 0.14)" stroke="#19fb9b" stroke-width="3" /><path class="draw" d="M13 23.5l6.5 6.5 13-14" stroke="#19fb9b" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg><span>Merchant paid upfront</span></div>
            <div id="rl-2" class="rule"><svg width="40" height="40" viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="rgb(25 251 155 / 0.14)" stroke="#19fb9b" stroke-width="3" /><path class="draw" d="M13 23.5l6.5 6.5 13-14" stroke="#19fb9b" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg><span>Installment due every month</span></div>
            <div id="rl-3" class="rule"><svg width="40" height="40" viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="rgb(25 251 155 / 0.14)" stroke="#19fb9b" stroke-width="3" /><path class="draw" d="M13 23.5l6.5 6.5 13-14" stroke="#19fb9b" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg><span>Every repayment refills the pool</span></div>
          </div>
          <div class="col" style="left: 1000px">
            <h4>On-chain record</h4>
            <div class="lrow first lg-r"><span>loan · to merchant</span><span class="num" style="color: var(--green)">−700</span></div>
            <div class="lrow lg-r"><span>repayment 1/3</span><span class="num" style="color: var(--cyan)">+233.33</span></div>
            <div class="lrow lg-r"><span>repayment 2/3</span><span class="num" style="color: var(--cyan)">+233.33</span></div>
            <div class="lrow lg-r"><span>repayment 3/3</span><span class="num" style="color: var(--cyan)">+233.33</span></div>
          </div>
        </div>
      </div>
      </div>
      <script>

      // Split every .type element into per-character spans (typewriter reveal).
      document.querySelectorAll(".type").forEach((el) => {
        const walk = (node) => {
          [...node.childNodes].forEach((c) => {
            if (c.nodeType === 3) {
              const frag = document.createDocumentFragment();
              [...c.textContent].forEach((ch) => {
                const s = document.createElement("span");
                s.className = "ch";
                s.textContent = ch;
                frag.appendChild(s);
              });
              c.replaceWith(frag);
            } else if (c.nodeType === 1) walk(c);
          });
        };
        walk(el);
      });
      // Prepare stroke-draw paths.
      document.querySelectorAll("path.draw").forEach((p) => {
        const len = Math.ceil(p.getTotalLength());
        p.style.strokeDasharray = len;
        p.dataset.len = len;
      });

      
      const S = 81.6; // slot start in the main timeline; tweens below are written in main-timeline seconds
      const tl = gsap.timeline({ paused: true });
      const draw = (sel, at, dur = 0.45, ease = "power2.inOut") =>
        document.querySelectorAll(sel).forEach((p) =>
          tl.fromTo(p, { strokeDashoffset: p.dataset.len }, { strokeDashoffset: 0, duration: dur, ease }, at - S)
        );
      const wipeIn = (sel, at) => tl.fromTo(sel, { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power3.inOut" }, at - S);
      const wipeOut = (sel, at) => tl.fromTo(sel, { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(0% 100% 0% 0%)", duration: 0.45, ease: "power3.inOut", immediateRender: false }, at - S);
      // A coin rides a path: position comes from getPointAtLength on a seekable proxy tween.
      const ride = (coin, pathSel, at, dur = 0.7) => {
        const path = document.querySelector(pathSel);
        const len = path.getTotalLength();
        const el = document.querySelector(coin);
        const st = { p: 0 };
        const place = () => {
          const pt = path.getPointAtLength(st.p * len);
          el.style.transform = `translate(${pt.x}px, ${pt.y}px)`;
        };
        tl.set(el, { opacity: 1 }, at - S);
        tl.fromTo(st, { p: 0 }, { p: 1, duration: dur, ease: "power1.inOut", onUpdate: place, onStart: place }, at - S);
        tl.set(el, { opacity: 0 }, at + dur - S);
      };
      const level = (v, at, dur = 0.5) => tl.to("#pool-level", { scaleY: v, duration: dur, ease: "power2.inOut" }, at - S);
      const rule = (sel, at) => {
        tl.fromTo(sel, { opacity: 0.3 }, { opacity: 1, duration: 0.3 }, at - S);
        draw(sel + " path", at + 0.05, 0.3);
      };
      const row = (i, at) =>
        tl.fromTo(document.querySelectorAll(".lg-r")[i], { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, at - S);

      // ---------- 07b ledger ----------
      gsap.set("#pool-level", { scaleY: 0.78 });
      wipeIn("#lg-wrap", 81.6);
      // "Every loan" → the pool pays the merchant.
      ride("#coin-o1", "#po-out", 82.2);
      level(0.48, 82.3);
      rule("#rl-1", 82.5);
      row(0, 82.6);
      // "and repayment" → the first installment comes back.
      ride("#coin-i1", "#po-in", 83.0);
      level(0.58, 83.6);
      rule("#rl-2", 83.3);
      row(1, 83.5);
      // "each payment flows back into the pool in seconds"
      ride("#coin-i2", "#po-in", 86.5, 0.6);
      level(0.68, 87.0);
      rule("#rl-3", 86.9);
      row(2, 87.0);
      ride("#coin-i3", "#po-in", 87.5, 0.6);
      level(0.78, 88.0);
      row(3, 88.0);
      // "ready to fund the next purchase" → the refilled pool pays out again.
      tl.to("#pool", { scale: 1.06, duration: 0.25, yoyo: true, repeat: 1, ease: "power2.out" }, 89.3 - S);
      ride("#coin-o2", "#po-out", 89.9);
      level(0.5, 90.0);
      wipeOut("#lg-wrap", 91.3);

      window.__timelines["s07b-ledger"] = tl;
      </script>
    </template>
  </body>
</html>
