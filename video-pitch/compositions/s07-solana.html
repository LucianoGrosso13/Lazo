  <body>
    <template>
      <style>
        @font-face {
                font-family: "Bricolage Grotesque";
                src: url("assets/fonts/bricolage-latin.woff2") format("woff2");
                font-weight: 200 800;
                font-stretch: 75% 100%;
              }
        @font-face {
                font-family: "Martian Mono";
                src: url("assets/fonts/martian-mono-latin.woff2") format("woff2");
                font-weight: 100 800;
              }
        #root {
                --abyss: #07060b;
                --abyss-2: #0d0a17;
                --abyss-3: #141026;
                --ink: #f4f1ff;
                --ink-2: #b9b3d6;
                --ink-3: #9a93bb;
                --ghost: #6a6488;
                --violet: #9945ff;
                --cyan: #00c2ff;

                --crack: #ff5470;
                --hair: rgb(244 241 255 / 0.16);
                --display: "Bricolage Grotesque", sans-serif;
                --mono: "Martian Mono", monospace;
              }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: var(--ink);
          font-family: var(--display);
        }
        #root * {
          box-sizing: border-box;
        }
        .abs {
                position: absolute;
              }
        /* ---------- shared overlay vocabulary ---------- */
              .chip {
                position: absolute;
                display: flex;
                align-items: center;
                gap: 12px;
                font-family: var(--mono);
                font-size: 22px;
                line-height: 1;
                color: var(--ink);
                background: rgb(13 10 23 / 0.86);
                border: 2px solid var(--hair);
                border-radius: 999px;
                padding: 13px 22px;
                white-space: nowrap;
              }
        .dot {
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: var(--green);
              }
        .card {
                position: absolute;
                background: rgb(13 10 23 / 0.92);
                border: 2px solid var(--hair);
                border-radius: 28px;
                padding: 32px 38px;
                box-shadow: 0 30px 80px rgb(0 0 0 / 0.5);
              }
        .card h4 {
                font-family: var(--mono);
                font-weight: 500;
                font-size: 20px;
                letter-spacing: 0.08em;
                text-transform: uppercase;

              }
        .row {
                display: flex;
                justify-content: space-between;

                font-size: 32px;
                padding: 13px 0;
                border-top: 2px solid var(--hair);

        .row.first {
                border-top: 0;
              }
        .num {
                font-family: var(--mono);
                font-size: 28px;
                font-variant-numeric: tabular-nums;
              }
        .step.first {
                border-top: 0;
              }
        /* ---------- 07 terminal / ledger ---------- */
              #term {
                left: 1130px;
                top: 650px;
                width: 720px;
                background: rgb(7 6 11 / 0.94);
                border: 2px solid var(--hair);

        #term .c {

        #term .p {

              }
        #plate-chip .chip {

      </style>
      <div data-hf-id="hf-nfho" id="root" data-composition-id="s07-solana" data-width="1920" data-height="1080">
        <div data-hf-id="hf-bdsn" id="ov-term" class="grp">
        <div data-hf-id="hf-cpb4" id="te-chip" class="chip" style="left: 1130px; top: 578px"><span data-hf-id="hf-1e9j" class="dot" style="background: var(--violet)"></span>Prototype</div>
        <div data-hf-id="hf-yc08" id="term" class="abs">
          <div data-hf-id="hf-w8hg" class="c type">// lazo program · Solana</div>
          <div data-hf-id="hf-cs59" class="type"><span data-hf-id="hf-sgxz" class="p">›</span> open_plan()</div>
          <div data-hf-id="hf-630f" class="type"><span data-hf-id="hf-csmf" class="p">›</span> release_payout()</div>
          <div data-hf-id="hf-i94d" class="type"><span data-hf-id="hf-cebe" class="p">›</span> pay_installment()</div>
          <div data-hf-id="hf-aw91" class="type"><span data-hf-id="hf-c00d" class="p">›</span> crank_mark_late()</div>
        </div>
      </div>
        </div>
      <script>

      // Split every .type element into per-character spans (typewriter reveal).
      document.querySelectorAll(".type").forEach((el) => {
        const walk = (node) => {
          [...node.childNodes].forEach((c) => {
            if (c.nodeType === 3) {
              const frag = document.createDocumentFragment();
              [...c.textContent].forEach((ch) => {
                const s = document.createElement("span");
                s.className = "ch";
                s.textContent = ch;
                frag.appendChild(s);
              });
              c.replaceWith(frag);
            } else if (c.nodeType === 1) walk(c);
          });
        };
        walk(el);
      });
      // Prepare stroke-draw paths.
      document.querySelectorAll("path.draw").forEach((p) => {
        const len = Math.ceil(p.getTotalLength());
        p.style.strokeDasharray = len;
        p.dataset.len = len;
      });

      
      const S = 75.2; // slot start in the main timeline; tweens below are written in main-timeline seconds
      const tl = gsap.timeline({ paused: true });
      const chars = (sel) => document.querySelectorAll(sel + " .ch");
      const typeIn = (sel, at, per = 0.045) =>
        tl.fromTo(chars(sel), { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: per, ease: "none" }, at - S);
      const draw = (sel, at, dur = 0.45, ease = "power2.inOut") =>
        document.querySelectorAll(sel).forEach((p) =>
          tl.fromTo(p, { strokeDashoffset: p.dataset.len }, { strokeDashoffset: 0, duration: dur, ease }, at - S)
        );
      const fadeOut = (sel, at, dur = 0.3) => tl.to(sel, { opacity: 0, y: -12, duration: dur, ease: "power2.in" }, at - S);
      const count = (el, from, to, at, dur, fmt) => {
        const s = { v: from };
        tl.fromTo(s, { v: from }, { v: to, duration: dur, ease: "power3.out", onUpdate: () => (el.textContent = fmt(s.v)) }, at - S);
      };
      const wipeIn = (sel, at) => tl.fromTo(sel, { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power3.inOut" }, at - S);
      const wipeOut = (sel, at) => tl.fromTo(sel, { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(0% 100% 0% 0%)", duration: 0.45, ease: "power3.inOut", immediateRender: false }, at - S);

// ---------- 07 solana ----------
      tl.fromTo("#te-chip", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 75.25 - S);
      tl.fromTo("#term", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 75.3 - S);
      const termLines = document.querySelectorAll("#term .type");
      [75.55, 75.95, 76.4, 77.6, 78.8].forEach((at, i) =>
        tl.fromTo(termLines[i].querySelectorAll(".ch"), { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.022, ease: "none" }, at - S)
      );
      fadeOut("#te-chip, #term", 81.2, 0.3);

      
        window.__timelines["s07-solana"] = tl;
      </script>
    </template>
