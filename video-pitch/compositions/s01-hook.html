<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        @font-face {
                font-family: "Bricolage Grotesque";
                src: url("assets/fonts/bricolage-latin.woff2") format("woff2");
                font-weight: 200 800;
                font-stretch: 75% 100%;
              }
        @font-face {
                font-family: "Martian Mono";
                src: url("assets/fonts/martian-mono-latin.woff2") format("woff2");
                font-weight: 100 800;
              }
        #root {
                --abyss: #07060b;
                --abyss-2: #0d0a17;
                --abyss-3: #141026;
                --ink: #f4f1ff;
                --ink-2: #b9b3d6;
                --ink-3: #9a93bb;
                --ghost: #6a6488;
                --violet: #9945ff;
                --cyan: #00c2ff;
                --green: #19fb9b;
                --crack: #ff5470;
                --hair: rgb(244 241 255 / 0.16);
                --display: "Bricolage Grotesque", sans-serif;
                --mono: "Martian Mono", monospace;
              }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: var(--ink);
          font-family: var(--display);
        }
        #root * {
          box-sizing: border-box;
        }
        .abs {
                position: absolute;
              }
        /* ---------- 01 hook ---------- */
              #hook-line {
                left: 70px;
                top: 60px;
                display: flex;
                align-items: center;
                gap: 22px;
                padding: 20px 34px 24px;
                border-radius: 24px;
                background: rgb(7 6 11 / 0.66);
                font-weight: 800;
                font-size: 70px;
                letter-spacing: -0.02em;
              }
        #hook-b {
                color: var(--ink-2);
              }
      </style>
      <div data-hf-id="hf-hwjl" id="root" data-composition-id="s01-hook" data-width="1920" data-height="1080">
        <div data-hf-id="hf-5pw0" id="ov-hook" class="grp">
        <div data-hf-id="hf-7jni" id="hook-line" class="abs">
          <span data-hf-id="hf-vnaf" id="hook-a" class="type">Income</span>
          <svg data-hf-id="hf-pb8u" id="hook-neq" width="58" height="58" viewBox="0 0 58 58">
            <path data-hf-id="hf-s6vj" class="draw" d="M8 21h42M8 37h42" stroke="#19fb9b" stroke-width="6" stroke-linecap="round" fill="none" />
            <path data-hf-id="hf-twet" class="draw" d="M40 6 18 52" stroke="#19fb9b" stroke-width="6" stroke-linecap="round" fill="none" />
          </svg>
          <span data-hf-id="hf-n14b" id="hook-b" class="type">access to credit</span>
        </div>
      </div>
      </div>
      <script>

      // Split every .type element into per-character spans (typewriter reveal).
      document.querySelectorAll(".type").forEach((el) => {
        const walk = (node) => {
          [...node.childNodes].forEach((c) => {
            if (c.nodeType === 3) {
              const frag = document.createDocumentFragment();
              [...c.textContent].forEach((ch) => {
                const s = document.createElement("span");
                s.className = "ch";
                s.textContent = ch;
                frag.appendChild(s);
              });
              c.replaceWith(frag);
            } else if (c.nodeType === 1) walk(c);
          });
        };
        walk(el);
      });
      // Prepare stroke-draw paths.
      document.querySelectorAll("path.draw").forEach((p) => {
        const len = Math.ceil(p.getTotalLength());
        p.style.strokeDasharray = len;
        p.dataset.len = len;
      });

      
      const S = 4.4; // slot start in the main timeline; tweens below are written in main-timeline seconds
      const tl = gsap.timeline({ paused: true });
      const chars = (sel) => document.querySelectorAll(sel + " .ch");
      const typeIn = (sel, at, per = 0.045) =>
        tl.fromTo(chars(sel), { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: per, ease: "none" }, at - S);
      const draw = (sel, at, dur = 0.45, ease = "power2.inOut") =>
        document.querySelectorAll(sel).forEach((p) =>
          tl.fromTo(p, { strokeDashoffset: p.dataset.len }, { strokeDashoffset: 0, duration: dur, ease }, at - S)
        );
      const fadeOut = (sel, at, dur = 0.3) => tl.to(sel, { opacity: 0, y: -12, duration: dur, ease: "power2.in" }, at - S);
      const count = (el, from, to, at, dur, fmt) => {
        const s = { v: from };
        tl.fromTo(s, { v: from }, { v: to, duration: dur, ease: "power3.out", onUpdate: () => (el.textContent = fmt(s.v)) }, at - S);
      };
      const wipeIn = (sel, at) => tl.fromTo(sel, { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power3.inOut" }, at - S);
      const wipeOut = (sel, at) => tl.fromTo(sel, { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(0% 100% 0% 0%)", duration: 0.45, ease: "power3.inOut", immediateRender: false }, at - S);

// ---------- 01 hook ----------
      tl.fromTo("#hook-line", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 4.42 - S);
      typeIn("#hook-a", 4.5);
      draw("#hook-neq path", 4.85, 0.35);
      typeIn("#hook-b", 5.15, 0.04);
      fadeOut("#hook-line", 7.8);

      
        window.__timelines["s01-hook"] = tl;
      </script>
    </template>
  </body>
</html>
