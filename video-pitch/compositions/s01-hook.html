<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        @font-face {
                font-family: "Bricolage Grotesque";
                src: url("assets/fonts/bricolage-latin.woff2") format("woff2");
                font-weight: 200 800;
                font-stretch: 75% 100%;
              }
        @font-face {
                font-family: "Martian Mono";
                src: url("assets/fonts/martian-mono-latin.woff2") format("woff2");
                font-weight: 100 800;
              }
        #root {
                --abyss: #07060b;
                --abyss-2: #0d0a17;
                --abyss-3: #141026;
                --ink: #f4f1ff;
                --ink-2: #b9b3d6;
                --ink-3: #9a93bb;
                --ghost: #6a6488;
                --violet: #9945ff;
                --cyan: #00c2ff;
                --green: #19fb9b;
                --crack: #ff5470;
                --hair: rgb(244 241 255 / 0.16);
                --display: "Bricolage Grotesque", sans-serif;
                --mono: "Martian Mono", monospace;
              }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: var(--ink);
          font-family: var(--display);
        }
        #root * {
          box-sizing: border-box;
        }
        .abs {
                position: absolute;
              }
        /* ---------- 01 hook: checklist over Luciano's t-shirt ---------- */
              #hook-list {
                left: 120px;
                top: 745px;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
              }
        .hk {
                display: flex;
                align-items: center;
                gap: 20px;
                font-weight: 700;
                font-size: 50px;
                letter-spacing: -0.015em;
                line-height: 1.15;
                padding: 14px 30px 16px 18px;
                border-radius: 22px;
                background: rgb(7 6 11 / 0.74);
                border: 2px solid var(--hair);
              }
        .hk svg {
                flex: none;
              }
        #hk-3 {
                color: var(--crack);
              }
      </style>
      <div data-hf-id="hf-hwjl" id="root" data-composition-id="s01-hook" data-width="1920" data-height="1080">
        <div id="ov-hook" class="grp">
        <div id="hook-list" class="abs">
          <div id="hk-1" class="hk"><svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="rgb(25 251 155 / 0.14)" stroke="#19fb9b" stroke-width="3" /><path class="draw" d="M13 23.5l6.5 6.5 13-14" stroke="#19fb9b" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg><span>Works every day</span></div>
          <div id="hk-2" class="hk"><svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="rgb(25 251 155 / 0.14)" stroke="#19fb9b" stroke-width="3" /><path class="draw" d="M13 23.5l6.5 6.5 13-14" stroke="#19fb9b" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg><span>Steady income</span></div>
          <div id="hk-3" class="hk"><svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="rgb(255 84 112 / 0.16)" stroke="#ff5470" stroke-width="3" /><path class="draw" d="M15 15l16 16" stroke="#ff5470" stroke-width="4.5" fill="none" stroke-linecap="round" /><path class="draw" d="M31 15 15 31" stroke="#ff5470" stroke-width="4.5" fill="none" stroke-linecap="round" /></svg><span>Credit card</span></div>
        </div>
      </div>
      </div>
      <script>

      // Split every .type element into per-character spans (typewriter reveal).
      document.querySelectorAll(".type").forEach((el) => {
        const walk = (node) => {
          [...node.childNodes].forEach((c) => {
            if (c.nodeType === 3) {
              const frag = document.createDocumentFragment();
              [...c.textContent].forEach((ch) => {
                const s = document.createElement("span");
                s.className = "ch";
                s.textContent = ch;
                frag.appendChild(s);
              });
              c.replaceWith(frag);
            } else if (c.nodeType === 1) walk(c);
          });
        };
        walk(el);
      });
      // Prepare stroke-draw paths.
      document.querySelectorAll("path.draw").forEach((p) => {
        const len = Math.ceil(p.getTotalLength());
        p.style.strokeDasharray = len;
        p.dataset.len = len;
      });

      
      const S = 0.8; // slot start in the main timeline; tweens below are written in main-timeline seconds
      const tl = gsap.timeline({ paused: true });
      const chars = (sel) => document.querySelectorAll(sel + " .ch");
      const typeIn = (sel, at, per = 0.045) =>
        tl.fromTo(chars(sel), { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: per, ease: "none" }, at - S);
      const draw = (sel, at, dur = 0.45, ease = "power2.inOut") =>
        document.querySelectorAll(sel).forEach((p) =>
          tl.fromTo(p, { strokeDashoffset: p.dataset.len }, { strokeDashoffset: 0, duration: dur, ease }, at - S)
        );
      const fadeOut = (sel, at, dur = 0.3) => tl.to(sel, { opacity: 0, y: -12, duration: dur, ease: "power2.in" }, at - S);
      const count = (el, from, to, at, dur, fmt) => {
        const s = { v: from };
        tl.fromTo(s, { v: from }, { v: to, duration: dur, ease: "power3.out", onUpdate: () => (el.textContent = fmt(s.v)) }, at - S);
      };
      const wipeIn = (sel, at) => tl.fromTo(sel, { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power3.inOut" }, at - S);
      const wipeOut = (sel, at) => tl.fromTo(sel, { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(0% 100% 0% 0%)", duration: 0.45, ease: "power3.inOut", immediateRender: false }, at - S);

// ---------- 01 hook ----------
      // Checklist lands on the words: "working hard every single day" · "steady income" · "invisible".
      [["#hk-1", 1.05], ["#hk-2", 3.45], ["#hk-3", 5.8]].forEach(([sel, at]) => {
        tl.fromTo(sel, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, at - S);
        draw(sel + " path", at + 0.15, 0.35);
      });
      tl.fromTo("#hk-3", { scale: 1 }, { scale: 1.06, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out", transformOrigin: "0% 50%" }, 6.4 - S);
      fadeOut("#hook-list", 7.85);

      
        window.__timelines["s01-hook"] = tl;
      </script>
    </template>
  </body>
</html>
