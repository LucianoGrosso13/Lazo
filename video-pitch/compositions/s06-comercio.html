      <script>

      // Split every .type element into per-character spans (typewriter reveal).
      document.querySelectorAll(".type").forEach((el) => {
        const walk = (node) => {
          [...node.childNodes].forEach((c) => {
            if (c.nodeType === 3) {
              const frag = document.createDocumentFragment();
              [...c.textContent].forEach((ch) => {
                const s = document.createElement("span");
                s.className = "ch";
                s.textContent = ch;
                frag.appendChild(s);
              });
              c.replaceWith(frag);
            } else if (c.nodeType === 1) walk(c);
          });
        };
        walk(el);
      });
      // Prepare stroke-draw paths.
      document.querySelectorAll("path.draw").forEach((p) => {
        const len = Math.ceil(p.getTotalLength());
        p.style.strokeDasharray = len;
        p.dataset.len = len;
      });

      
      const S = 59.9; // slot start in the main timeline; tweens below are written in main-timeline seconds
      const tl = gsap.timeline({ paused: true });
      const chars = (sel) => document.querySelectorAll(sel + " .ch");
      const typeIn = (sel, at, per = 0.045) =>
        tl.fromTo(chars(sel), { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: per, ease: "none" }, at - S);
      const draw = (sel, at, dur = 0.45, ease = "power2.inOut") =>
        document.querySelectorAll(sel).forEach((p) =>
          tl.fromTo(p, { strokeDashoffset: p.dataset.len }, { strokeDashoffset: 0, duration: dur, ease }, at - S)
        );
      const fadeOut = (sel, at, dur = 0.3) => tl.to(sel, { opacity: 0, y: -12, duration: dur, ease: "power2.in" }, at - S);
      const count = (el, from, to, at, dur, fmt) => {
        const s = { v: from };
        tl.fromTo(s, { v: from }, { v: to, duration: dur, ease: "power3.out", onUpdate: () => (el.textContent = fmt(s.v)) }, at - S);
      };
      const wipeIn = (sel, at) => tl.fromTo(sel, { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power3.inOut" }, at - S);
      const wipeOut = (sel, at) => tl.fromTo(sel, { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(0% 100% 0% 0%)", duration: 0.45, ease: "power3.inOut", immediateRender: false }, at - S);

// ---------- 06 merchant ----------
      // "For merchants" → card · "paid upfront" → Paid today ✓ · "small fee" → chip · "pays over time" → months light up.
      tl.fromTo("#se-card", { opacity: 0, x: -70 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 60.0 - S);
      tl.fromTo("#se-merchant .who, #se-buyer .who", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 60.3 - S);
      tl.fromTo("#se-paid", { opacity: 0, scale: 0.9, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, 62.05 - S);
      draw("#se-paid path", 62.2, 0.35);
      tl.fromTo("#se-fee", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 63.5 - S);
      tl.fromTo("#se-buyer .tick, #se-buyer .bar", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 64.6 - S);
      document.querySelectorAll(".se-t i").forEach((el, i) =>
        tl.to(el, { backgroundColor: "rgba(0,194,255,1)", scale: 1.15, duration: 0.25, ease: "back.out(2)" }, 65.0 + i * 0.45 - S)
      );
      fadeOut("#se-card", 66.95, 0.3);

      
        window.__timelines["s06-comercio"] = tl;
      </script>
