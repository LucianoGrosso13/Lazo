      <script>

      // Split every .type element into per-character spans (typewriter reveal).
      document.querySelectorAll(".type").forEach((el) => {
        const walk = (node) => {
          [...node.childNodes].forEach((c) => {
            if (c.nodeType === 3) {
              const frag = document.createDocumentFragment();
              [...c.textContent].forEach((ch) => {
                const s = document.createElement("span");
                s.className = "ch";
                s.textContent = ch;
                frag.appendChild(s);
              });
              c.replaceWith(frag);
            } else if (c.nodeType === 1) walk(c);
          });
        };
        walk(el);
      });
      // Prepare stroke-draw paths.
      document.querySelectorAll("path.draw").forEach((p) => {
        const len = Math.ceil(p.getTotalLength());
        p.style.strokeDasharray = len;
        p.dataset.len = len;
      });

      
      const S = 67.0; // slot start in the main timeline; tweens below are written in main-timeline seconds
      const tl = gsap.timeline({ paused: true });
      const chars = (sel) => document.querySelectorAll(sel + " .ch");
      const typeIn = (sel, at, per = 0.045) =>
        tl.fromTo(chars(sel), { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: per, ease: "none" }, at - S);
      const draw = (sel, at, dur = 0.45, ease = "power2.inOut") =>
        document.querySelectorAll(sel).forEach((p) =>
          tl.fromTo(p, { strokeDashoffset: p.dataset.len }, { strokeDashoffset: 0, duration: dur, ease }, at - S)
        );
      const fadeOut = (sel, at, dur = 0.3) => tl.to(sel, { opacity: 0, y: -12, duration: dur, ease: "power2.in" }, at - S);
      const count = (el, from, to, at, dur, fmt) => {
        const s = { v: from };
        tl.fromTo(s, { v: from }, { v: to, duration: dur, ease: "power3.out", onUpdate: () => (el.textContent = fmt(s.v)) }, at - S);
      };
      const wipeIn = (sel, at) => tl.fromTo(sel, { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power3.inOut" }, at - S);
      const wipeOut = (sel, at) => tl.fromTo(sel, { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(0% 100% 0% 0%)", duration: 0.45, ease: "power3.inOut", immediateRender: false }, at - S);

// ---------- pool (full screen) ----------
      wipeIn("#po-wrap", 67.0);
      tl.fromTo("#pool", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, 67.35 - S);
      tl.fromTo("#pool-level", { scaleY: 0 }, { scaleY: 0.72, duration: 0.8, ease: "power2.out" }, 67.5 - S);
      tl.fromTo("#po-merchant", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 68.0 - S);
      draw("#po-out", 68.35, 0.5);
      draw("#po-out-h", 68.8, 0.2);
      tl.fromTo("#po-l-out", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 68.8 - S);
      tl.to("#pool-level", { scaleY: 0.42, duration: 0.6, ease: "power2.inOut" }, 68.6 - S);
      tl.fromTo("#po-buyer", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 69.6 - S);
      draw("#po-in", 70.0, 0.5);
      draw("#po-in-h", 70.45, 0.2);
      tl.fromTo("#po-l-in", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 70.45 - S);
      tl.to("#pool-level", { scaleY: 0.78, duration: 1.2, ease: "power2.inOut" }, 71.0 - S);
      tl.to("#pool", { borderColor: "#00c2ff", duration: 0.4 }, 73.1 - S);
      tl.fromTo("#pool-sol", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 73.2 - S);
      wipeOut("#po-wrap", 75.0);
